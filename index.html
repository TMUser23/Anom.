<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anom.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #15202b; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #38444d; }
        h1 { color: #1da1f2; font-size: 24px; }
        .pizza-btn { background: #ff9900; border: none; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; text-decoration: none; }
        
        .create-post { background: #192734; padding: 15px; border-radius: 10px; margin: 20px 0; }
        textarea { width: 100%; height: 80px; background: transparent; border: none; color: #fff; resize: none; outline: none; font-size: 16px; }
        .post-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid #38444d; padding-top: 10px; }
        input[type="file"] { display: none; }
        .file-label { cursor: pointer; color: #1da1f2; font-size: 20px; }
        .send-btn { background: #1da1f2; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .posts { display: flex; flex-direction: column; gap: 15px; }
        .post { background: #192734; padding: 15px; border-radius: 10px; position: relative; }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: #8899a6; font-size: 14px; }
        .author-user { color: #fff; font-weight: bold; }
        .author-admin { color: #ff4d4d; font-weight: bold; }
        .post-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 10px; margin-top: 10px; }
        
        .delete-btn, .ban-btn { background: transparent; border: none; cursor: pointer; font-size: 14px; margin-left: 10px; }
        .delete-btn { color: #ff4d4d; }
        .ban-btn { color: #ff9900; }
        .admin-panel { background: #253341; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .admin-input { padding: 5px; border-radius: 4px; border: none; }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // НАСТРОЙКА FIREBASE (Вставьте свои ключи)
        const firebaseConfig = {
            apiKey: "AIzaSyBXdw2C8rAEQESmrLZkuYKDJYhhwIe1yhQ",
            authDomain: "anom-a7aa3.firebaseapp.com",
            projectId: "anom-a7aa3",
            storageBucket: "anom-a7aa3.appspot.com",
            messagingSenderId: "330680976864",
            appId: "1:330680976864:web:a55d02f36e7ee2e504d785"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Генерируем или получаем уникальный ID устройства для бана/удаления своих постов
        let userId = localStorage.getItem('anom_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('anom_user_id', userId);
        }

        let isAdmin = false;

        // Пароль админа (для простоты)
        window.checkAdmin = function() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') { // Измените пароль на свой!
                isAdmin = true;
                alert('Вы вошли как admin!');
                renderPosts();
            } else {
                alert('Неверный пароль');
            }
        };

        // Поддержать (просто всплывашка)
        window.supportDev = function() {
            alert('Спасибо за поддержку разработчика! 🍕 (Эта кнопка ничего не списывает)');
        };

        // Отправка поста
        window.sendPost = async function() {
            // Проверка на бан
            const banCheck = await getDoc(doc(db, "banned", userId));
            if (banCheck.exists()) {
                alert("Вы забанены и не можете публиковать посты!");
                return;
            }

            const text = document.getElementById('post-text').value;
            const fileInput = document.getElementById('post-file');
            const file = fileInput.files[0];

            if (!text && !file) {
                alert("Введите текст или выберите фото!");
                return;
            }

            let imageUrl = "";
            if (file) {
                const storageRef = ref(storage, 'images/' + Date.now() + '_' + file.name);
                await uploadBytes(storageRef, file);
                imageUrl = await getDownloadURL(storageRef);
            }

            await addDoc(collection(db, "posts"), {
                text: text,
                image: imageUrl,
                authorId: userId,
                authorName: isAdmin ? "admin" : "AnomUser",
                createdAt: new Date()
            });

            document.getElementById('post-text').value = "";
            fileInput.value = "";
        };

        // Удаление поста
        window.deletePost = async function(postId, authorId) {
            if (isAdmin || authorId === userId) {
                await deleteDoc(doc(db, "posts", postId));
            } else {
                alert("Вы можете удалять только свои посты!");
            }
        };

        // Бан пользователя (Только для Админа)
        window.banUser = async function(targetUserId) {
            if (!isAdmin) return;
            if (confirm("Забанить этого пользователя?")) {
                await setDoc(doc(db, "banned", targetUserId), { banned: true });
                alert("Пользователь забанен!");
            }
        };

        // Отображение постов в реальном времени
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const postsContainer = document.getElementById('posts');
            postsContainer.innerHTML = "";
            
            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const postId = docSnap.id;
                
                const isMyPost = post.authorId === userId;
                const canDelete = isMyPost || isAdmin;

                const postEl = document.createElement('div');
                postEl.className = 'post';
                postEl.innerHTML = `
                    <div class="post-header">
                        <span class="${post.authorName === 'admin' ? 'author-admin' : 'author-user'}">
                            ${post.authorName} ${isMyPost ? '(Вы)' : ''}
                        </span>
                        <div>
                            ${canDelete ? `<button class="delete-btn" onclick="deletePost('${postId}', '${post.authorId}')">Удалить</button>` : ''}
                            ${isAdmin && !isMyPost ? `<button class="ban-btn" onclick="banUser('${post.authorId}')"> Забанить</button>` : ''}
                        </div>
                    </div>
                    <div>${post.text}</div>
                    ${post.image ? `<img src="${post.image}" class="post-img">` : ''}
                `;
                postsContainer.appendChild(postEl);
            });
        });
    </script>
</head>
<body>

<div class="container">
    <header>
        <h1>Anom</h1>
        <button class="pizza-btn" onclick="supportDev()">Поддержать 🍕</button>
    </header>

    <!-- Панель входа для админа -->
    <div class="admin-panel">
        <input type="password" id="admin-pass" class="admin-input" placeholder="Пароль админа">
        <button onclick="checkAdmin()">Войти как Admin</button>
    </div>

    <!-- Форма создания поста -->
    <div class="create-post">
        <textarea id="post-text" placeholder="Что нового? (Без регистрации)"></textarea>
        <div class="post-actions">
            <label class="file-label">
                Фото <input type="file" id="post-file" accept="image/*">
            </label>
            <button class="send-btn" onclick="sendPost()">Опубликовать</button>
        </div>
    </div>

    <!-- Лента постов -->
    <div class="posts" id="posts"></div>
</div>

</body>
</html>
